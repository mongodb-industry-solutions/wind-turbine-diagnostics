env:
  NODE_ENV: staging
  APP_NAME: devrel-demo-vectorsearch-audio-turbine-staging
  DATABASE_NAME: audio

# Secrets for frontend (if any needed)
envSecrets:
  MONGODB_URI: wind-turbine-diagnostics

# Sidecar container configuration (frontend + backend in same pod)
sidecarContainers:
  - name: backend
    image: 795250896452.dkr.ecr.us-east-1.amazonaws.com/industrysolutions/wind-turbine-diagnostics-backend:latest
    ports:
      - containerPort: 8000
        name: backend
    env:
      - name: MONGODB_URI
        valueFrom:
          secretKeyRef:
            name: wind-turbine-diagnostics
            key: MONGODB_URI
      - name: APP_NAME
        value: "devrel-demo-vectorsearch-audio-turbine-staging"

# Kanopy security and ownership (requires web-app chart v4.30.0+)
security:
  dataClassification: "Internal"
  dataDesignation: ["MI"]

ownership:
  driEmail: javier.guajardo@mongodb.com
